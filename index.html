<!DOCTYPE html>
<html lang="en">
<head>
    <meta>
    <meta>
    <title>X / 0 Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon-32x32.png">
      
</head>
<body>
    
    <div class="container">

        <div class="heading">
        <h2>X - O Game
        </h2>
        </div>

        <div class="boxes">
            <div class="square1 box" value="1"></div>
            <div class="square2 box" value="2"></div>
            <div class="square3 box" value="3"></div>
            <div class="square4 box" value="4"></div>
            <div class="square5 box" value="5"></div>
            <div class="square6 box" value="6"></div>
            <div class="square7 box" value="7"></div>
            <div class="square8 box" value="8"></div>
            <div class="square9 box" value="9"></div>
        </div>

        <div class="turn-box">
        <h3 id="status" >Turn : X</h3>
        </div>

        <div class="line" id="win-line"></div>

        <button id="reset-btn">
            &#8634
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
